<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン｜Ryo緑</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase v8互換 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

<header class="header">
  <div class="logo">Ryo緑</div>

  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>

  <nav class="nav" id="nav">
    <a href="index.html#concept">こだわり</a>
    <a href="index.html#menu">メニュー</a>
    <a href="index.html#kodawari">イベント</a>
    <a href="access.html">アクセス</a>
    <a href="mypage.html">マイページ</a>
    <a href="reserve.html" class="nav-reserve">ご予約</a>
  </nav>
</header>

<section class="section reserve-panel-vertical">
  <h2>ログインして予約する</h2>
  <p>ご予約にはログインが必要です。お好きな方法をお選びください。</p>

  <div class="reserve-links">
    <button class="reserve-btn" id="lineLogin">LINEでログイン</button>
    <button class="reserve-btn" id="googleLogin" style="background:#db4437;">Googleでログイン</button>
    <button class="reserve-btn" id="emailLogin">メールアドレスでログイン</button>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSc4LexwzjVUV8x5D3-y20Qctr-ck9bdk4icGsduCBfl6KlC4w/viewform?usp=publish-editor"
       class="reserve-btn"
       style="background:#6b8f71;">
       ゲストとして予約する（ログイン不要）
    </a>
  </div>

  <p style="margin-top:20px; font-size:14px; color:#666;">
    ログイン後、予約フォームへ進みます。<br>
    ※ログインが難しい方は「ゲスト予約」をご利用ください。
  </p>
</section>

<footer class="footer">
  <div>Ryo緑</div>
  <small>© Ryo緑</small>
</footer>

<script>
  /* ハンバーガー */
  const hamburger = document.getElementById("hamburger");
  const nav = document.getElementById("nav");
  hamburger.addEventListener("click", () => nav.classList.toggle("active"));
</script>

<script>
  /* ▼ Firebase設定（あなたの値） */
  const firebaseConfig = {
    apiKey: "AIzaSyDnXJIOmutkJ0SrPln5XdKHUF9UUEnhtdI",
    authDomain: "ryoen-restaurant.github.io",
    projectId: "ryoen-1dc81",
    storageBucket: "ryoen-1dc81.firebasestorage.app",
    messagingSenderId: "92335833506",
    appId: "1:92335833506:web:ac55b67620a086cfd332fb",
    measurementId: "G-6D3M8D7VG6"
  };

  firebase.initializeApp(firebaseConfig);

  /* ▼ LIFF 初期化 */
  async function initLiff() {
    await liff.init({ liffId: "2011522851-uNGHHKMk" });

    if (liff.isLoggedIn()) {
      window.location.href = "mypage.html";
    }
  }
  initLiff();

  /* ▼ LINEログイン */
  document.getElementById("lineLogin").addEventListener("click", () => {
    if (!liff.isLoggedIn()) {
      liff.login();
    }
  });

  /* ▼ Googleログイン（popup方式：GitHub Pagesで最も安定） */
  document.getElementById("googleLogin").addEventListener("click", () => {
    const provider = new firebase.auth.GoogleAuthProvider();

    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .then(() => {
        return firebase.auth().signInWithPopup(provider);
      })
      .then(result => {
        const user = result.user;

        const profile = {
          displayName: user.displayName,
          userId: user.uid,
          pictureUrl: user.photoURL
        };

        localStorage.setItem("userProfile", JSON.stringify(profile));

        window.location.href = "mypage.html";
      })
      .catch(err => {
        console.error("Googleログインエラー:", err);
        alert("Googleログインに失敗しました");
      });
  });

  /* ▼ メールログイン（後で実装） */
  document.getElementById("emailLogin").addEventListener("click", () => {
    alert("メールログイン処理をここに追加します");
  });
</script>

</body>
</html>
