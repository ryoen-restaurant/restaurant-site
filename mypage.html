<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ｜Ryo緑</title>

  <link rel="stylesheet" href="style.css">

  <!-- Firebase v8互換 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

<header class="header">
  <div class="logo">Ryo緑</div>
</header>

<section class="section reserve-panel-vertical">
  <h2>マイページ</h2>

  <div id="profileBox" class="reserve-links" style="margin-bottom:20px;">
    <p>読み込み中...</p>
  </div>

  <div class="reserve-links">
    <button id="goReserve" class="reserve-btn">新規予約</button>
    <a href="edit-profile.html" class="reserve-btn" style="background:#5b8;">登録情報を編集</a>
    <a href="#" id="logoutBtn" class="reserve-btn" style="background:#b55;">ログアウト</a>
  </div>

  <h3 style="margin-top:40px;">予約履歴</h3>
  <div id="historyBox">
    <p>読み込み中...</p>
  </div>
</section>

<script>
  /* ▼ Firebase設定（正しい設定に統一） */
  const firebaseConfig = {
    apiKey: "AIzaSyDnXJIOmutkJ0SrPln5XdKHUF9UUEnhtdI",
    authDomain: "ryoenn-1dc81.firebaseapp.com",
    projectId: "ryoenn-1dc81",
    storageBucket: "ryoenn-1dc81.appspot.com",
    messagingSenderId: "92335833506",
    appId: "1:92335833506:web:ac55b67620a086cfd332fb",
    measurementId: "G-6D3M8D7VG6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  async function init() {
    await liff.init({ liffId: "2011522851-uNGHHKMk" });

    let profile = null;
    let userData = null;

    /* ▼ LINEログイン */
    if (liff.isLoggedIn()) {
      const p = await liff.getProfile();
      profile = {
        userId: p.userId
      };
    }

    /* ▼ Firebaseメールログイン */
    const firebaseUser = firebase.auth().currentUser;
    if (firebaseUser) {
      profile = {
        userId: firebaseUser.uid,
        email: firebaseUser.email
      };
    }

    /* ▼ ローカル保存（新規登録ユーザー） */
    if (!profile) {
      const saved = localStorage.getItem("userProfile");
      if (saved) profile = JSON.parse(saved);
    }

    /* ▼ 未ログインなら予約ページへ */
    if (!profile) {
      window.location.href = "reserve.html";
      return;
    }

    /* ▼ Firestoreからユーザーデータ取得（name を使用） */
    try {
      const userDoc = await db.collection("users").doc(profile.userId).get();

      if (userDoc.exists) {
        userData = userDoc.data();

        // 🔥 ここが最重要：Firestore の name を表示名にする
        if (userData.name) {
          profile.displayName = userData.name;
        } else {
          profile.displayName = profile.email || "名前未設定";
        }

      } else {
        userData = {};
        profile.displayName = profile.email || "名前未設定";
      }

    } catch (e) {
      console.warn("Firestore読み込み失敗:", e);
      userData = {};
      profile.displayName = profile.email || "名前未設定";
    }

    /* ▼ プロフィール表示 */
    document.getElementById("profileBox").innerHTML = `
      <div style="text-align:center;">
        <p style="font-size:20px; font-weight:bold; margin-bottom:6px;">
          ${profile.displayName} さん
        </p>
      </div>
    `;

    /* ▼ 予約履歴読み込み */
    const historyRef = db.collection("reservations")
      .where("userId", "==", profile.userId)
      .orderBy("createdAt", "desc");

    const historySnap = await historyRef.get();

    let html = "";
    historySnap.forEach(doc => {
      const r = doc.data();
      html += `
        <div class="reserve-links" style="margin-bottom:10px;">
          <p>${r.date} ${r.time} / ${r.adult}名（大人）</p>
        </div>
      `;
    });

    document.getElementById("historyBox").innerHTML =
      html || "<p>予約履歴はありません。</p>";
  }

  init();

  /* ▼ 新規予約 */
  document.getElementById("goReserve").addEventListener("click", () => {
    window.location.replace("reserve-form.html");
  });

  /* ▼ ログアウト */
  document.getElementById("logoutBtn").addEventListener("click", () => {
    liff.logout();
    firebase.auth().signOut();
    localStorage.removeItem("userProfile");
    window.location.href = "reserve.html";
  });
</script>

</body>
</html>
