<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約フォーム｜Ryo緑</title>

  <link rel="stylesheet" href="style.css">

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Firebase v8互換 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    .reserve-panel-vertical {
      max-width: 520px;
      width: 92%;
      margin: 60px auto;
      padding: 36px 32px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    h2 { text-align:center; margin-bottom:28px; }
    label { display:block; margin-bottom:8px; font-weight:600; }
    input {
      width:100%; padding:14px; margin-bottom:22px;
      border:1px solid #ccc; border-radius:8px; background:#fafafa;
    }
.reserve-btn {
  width:100%;
  padding:16px;
  background:#4a7bd0;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:17px;
  display:block;          /* ← aタグでも幅100%になる */
  text-align:center;      /* ← 文字位置を中央に */
  box-sizing:border-box;  /* ← paddingの扱いを統一 */
}
  </style>
</head>

<body>

<section class="section reserve-panel-vertical">
  <h2>予約フォーム</h2>

  <div id="userBox">読み込み中...</div>

  <!-- ▼ 名前（姓・名 → 統合） -->
  <label>名前</label>
  <input type="text" id="fullName">

  <!-- ▼ 電話番号 -->
  <label>電話番号</label>
  <input type="tel" id="phone">

  <!-- ▼ メールアドレス -->
  <label>メールアドレス</label>
  <input type="email" id="email">

  <!-- ▼ 予約内容 -->
  <label>予約日</label>
  <input type="date" id="date">

  <label>時間</label>
  <input type="time" id="time">

  <label>人数（大人）</label>
  <input type="number" id="adult" min="1" value="1">

  <label>人数（子ども）</label>
  <input type="number" id="child" min="0" value="0">

  <label>その他ご要望</label>
  <input type="text" id="request">

<button id="submitBtn" class="reserve-btn">予約する</button>
<a href="mypage.html" class="reserve-btn" style="background:#888; margin-top:16px;">
  戻る
</a>
</section>

<script>
  /* ▼ Firebase設定 */
  const firebaseConfig = {
    apiKey: "AIzaSyDnXJIOmutkJ0SrPln5XdKHUF9UUEnhtdI",
    authDomain: "ryoenn-1dc81.firebaseapp.com",
    projectId: "ryoenn-1dc81",
    storageBucket: "ryoenn-1dc81.appspot.com",
    messagingSenderId: "92335833506",
    appId: "1:92335833506:web:ac55b67620a086cfd332fb",
    measurementId: "G-6D3M8D7VG6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  async function init() {

    await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    await liff.init({ liffId: "2011522851-uNGHHKMk" });

    let profile = null;

    if (liff.isLoggedIn()) {
      const p = await liff.getProfile();
      profile = { userId: p.userId };
    }

    const firebaseUser = firebase.auth().currentUser;
    if (firebaseUser) {
      profile = { userId: firebaseUser.uid };
    }

    if (!profile) {
      const saved = localStorage.getItem("userProfile");
      if (saved) profile = JSON.parse(saved);
    }

    if (!profile) {
      document.getElementById("userBox").innerHTML =
        "<p>ゲスト予約は Googleフォームからお願いします</p>";
      return;
    }

    try {
      const userDoc = await db.collection("users").doc(profile.userId).get();

      if (userDoc.exists) {
        const u = userDoc.data();

        document.getElementById("fullName").value = u.name || "";
        document.getElementById("phone").value = u.phone || "";
        document.getElementById("email").value = u.email || "";

        document.getElementById("userBox").innerHTML =
          `<p>${u.name} さん（会員番号：${u.memberNumber || "未登録"}）</p>`;
      } else {
        document.getElementById("userBox").innerHTML = "<p>ログイン中</p>";
      }

    } catch(e){
      document.getElementById("userBox").innerHTML = "<p>ログイン中</p>";
    }

    /* ▼ 予約処理 */
    document.getElementById("submitBtn").addEventListener("click", async () => {

      const fullName = document.getElementById("fullName").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const adult = document.getElementById("adult").value;
      const child = document.getElementById("child").value;
      const request = document.getElementById("request").value;

      if (!date || !time) {
        alert("予約日と時間を入力してください");
        return;
      }

      /* ▼ Firestore保存 */
      await db.collection("reservations").add({
        userId: profile.userId,
        name,
        phone,
        email,
        date,
        time,
        adult,
        child,
        request,
        createdAt: new Date()
      });

      /* ▼ Googleフォーム送信 */
      const googleFormPostURL =
        "https://docs.google.com/forms/d/e/1FAIpQLSc4LexwzjVUV8x5D3-y20Qctr-ck9bdk4icGsduCBfl6KlC4w/formResponse";

      const formData = new FormData();

      // 名前（姓＋名 → fullName）
      formData.append("entry.2071519680", name);

      // 電話番号
      formData.append("entry.1886123858", phone);

      // 大人
      formData.append("entry.23917293", adult);

      // 子ども
      formData.append("entry.918460202", child);

      // その他ご要望
      formData.append("entry.668676855", request);

      // 日付（Googleフォームの日時型）
      const d = new Date(date + "T" + time);
      formData.append("entry.1213423562_year", d.getFullYear());
      formData.append("entry.1213423562_month", d.getMonth() + 1);
      formData.append("entry.1213423562_day", d.getDate());
      formData.append("entry.1213423562_hour", d.getHours());
      formData.append("entry.1213423562_minute", d.getMinutes());

      // メールアドレス
      formData.append("emailAddress", email);

      fetch(googleFormPostURL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });

      alert("予約を受け付けました");
      window.location.href = "mypage.html";
    });
  }

  init();
</script>

</body>
</html>
