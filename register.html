<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録｜Ryo緑</title>
  <link rel="stylesheet" href="style.css">

  <style>
  /* ▼ register-section（白いカード） */
  .register-section {
    background: #ffffff !important;
    border-radius: 14px;
    padding: 32px 24px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    max-width: 480px;
    width: 100%;
    margin: 60px auto;
    box-sizing: border-box;
  }

  section {
    padding-left: 24px;
    padding-right: 24px;
    padding-top: 20px;
    padding-bottom: 40px;
    display: block;
  }

  .register-section h2 {
    text-align: center;
    margin-bottom: 26px;
    font-size: 24px;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 22px;
  }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    color: #444;
  }

  .form-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
  }

  .name-row {
    display: flex;
    gap: 20px;
  }

  .name-field {
    flex: 1;
  }

  .register-btn {
    width: 100%;
    padding: 16px;
    background: #4a7bd0;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 10px;
  }

  .register-btn:hover {
    opacity: 0.9;
  }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">Ryo緑</div>

  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>

  <nav class="nav" id="nav">
    <a href="index.html#concept">こだわり</a>
    <a href="index.html#menu">メニュー</a>
    <a href="index.html#kodawari">イベント</a>
    <a href="access.html">アクセス</a>
    <a href="mypage.html">マイページ</a>
    <a href="reserve.html" class="nav-reserve">ご予約</a>
  </nav>
</header>

<section class="register-section">
  <h2>新規登録</h2>

  <form id="registerForm">

    <div class="name-row">
      <div class="form-group name-field">
        <label>姓</label>
        <input id="lastName" required>
      </div>

      <div class="form-group name-field">
        <label>名</label>
        <input id="firstName" required>
      </div>
    </div>

    <div class="form-group">
      <label>メールアドレス</label>
      <input id="email" type="email" required>
    </div>

    <div class="form-group">
      <label>電話番号</label>
      <input id="phone" required>
    </div>

    <div class="form-group">
      <label>パスワード</label>
      <input id="password" type="password" required>
    </div>

    <div class="form-group">
      <label>パスワード確認</label>
      <input id="passwordConfirm" type="password" required>
    </div>

    <button class="register-btn" type="submit">登録する</button>
  </form>
</section>

<footer class="footer">
  <div>Ryo緑</div>
  <small>© Ryo緑</small>
</footer>

<script>
  const hamburger = document.getElementById("hamburger");
  const nav = document.getElementById("nav");
  hamburger.addEventListener("click", () => nav.classList.toggle("active"));
</script>

<!-- Firebase v9 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword 
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  import { 
    getFirestore, 
    doc, 
    setDoc, 
    getDoc,
    serverTimestamp,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnXJIOmutkJ0SrPln5XdKHUF9UUEnhtdI",
  authDomain: "ryoenn-1dc81.firebaseapp.com",
  projectId: "ryoenn-1dc81",
  storageBucket: "ryoenn-1dc81.appspot.com",
  messagingSenderId: "92335833506",
  appId: "1:92335833506:web:ac55b67620a086cfd332fb",
  measurementId: "G-6D3M8D7VG6"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  /* ▼ 会員番号自動付与（00001形式） */
  async function createUserIfNotExists(uid, email) {
    const userRef = doc(db, "users", uid);
    const userSnap = await getDoc(userRef);

    if (userSnap.exists()) {
      return userSnap.data();
    }

    const counterRef = doc(db, "system", "userCounter");

    await runTransaction(db, async (transaction) => {
      const counterSnap = await transaction.get(counterRef);
      let current = 0;

      if (counterSnap.exists()) {
        current = counterSnap.data().count;
      }

      const newNumber = current + 1;

      transaction.set(counterRef, { count: newNumber });

      transaction.set(userRef, {
        email,
        memberNumber: String(newNumber).padStart(5, "0"),
        createdAt: serverTimestamp()
      });
    });

    return (await getDoc(userRef)).data();
  }

  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("registerForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const lastName = document.getElementById("lastName").value.trim();
      const firstName = document.getElementById("firstName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;

      if (password !== passwordConfirm) {
        alert("パスワードが一致しません");
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await signInWithEmailAndPassword(auth, email, password);

        const uid = userCredential.user.uid;

        /* ▼ 会員番号付与 */
        await createUserIfNotExists(uid, email);

        /* ▼ 名前などの追加情報を保存（上書き） */
        await setDoc(doc(db, "users", uid), {
          lastName,
          firstName,
          email,
          phone,
          createdAt: serverTimestamp()
        }, { merge: true });

        alert("登録が完了しました！");
        location.href = "mypage.html";

      } catch (err) {
        console.error(err);
        alert("登録に失敗しました：" + err.message);
      }
    });
  });
</script>

</body>
</html>
