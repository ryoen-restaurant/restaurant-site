<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録｜Ryo緑</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase v8互換 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    #completeToast {
      display: none;
      opacity: 0;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #333;
      color: #fff;
      padding: 24px 32px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 99999;
      text-align: center;
      transition: opacity 0.5s ease;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">Ryo緑</div>
</header>

<section class="section reserve-panel-vertical">
  <h2>新規登録</h2>

  <form id="registerForm" class="register-form">

    <div class="name-row">
      <div class="name-field">
        <label>姓</label>
        <input type="text" id="lastName" class="reserve-input" required>
      </div>

      <div class="name-field">
        <label>名</label>
        <input type="text" id="firstName" class="reserve-input" required>
      </div>
    </div>

    <label>メールアドレス</label>
    <input type="email" id="email" class="reserve-input" required>

    <label>電話番号</label>
    <input type="tel" id="phone" class="reserve-input" required>

    <label>パスワード（6文字以上）</label>
    <input type="password" id="password" class="reserve-input" required>

    <label>パスワード（確認用）</label>
    <input type="password" id="passwordConfirm" class="reserve-input" required>

    <button type="submit" class="reserve-btn" style="margin-top:20px;">
      登録する
    </button>
  </form>

  <p id="msg" style="margin-top:20px; color:#d33;"></p>
</section>

<!-- ▼ 中央ポップアップ -->
<div id="completeToast">
  <p id="toastMessage">登録処理を行っています。</p>
  <button id="goMypageBtn" style="
    margin-top: 16px;
    padding: 10px 20px;
    background: #fff;
    color: #333;
    border-radius: 6px;
    border: none;
    font-size: 15px;
    cursor: pointer;
  ">
    マイページへ進む
  </button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDnXJIOmutkJ0SrPln5XdKHUF9UUEnhtdI",
    authDomain: "ryoen-restaurant.github.io",
    projectId: "ryoen-1dc81",
    storageBucket: "ryoen-1dc81.firebasestorage.app",
    messagingSenderId: "92335833506",
    appId: "1:92335833506:web:ac55b67620a086cfd332fb",
    measurementId: "G-6D3M8D7VG6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  /* ▼ マイページへ進むボタン */
  document.getElementById("goMypageBtn").addEventListener("click", () => {
    window.location.href = "mypage.html";
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    /* ▼ ボタンクリック → 即ポップアップ表示 */
    const toast = document.getElementById("completeToast");
    toast.style.display = "block";
    setTimeout(() => toast.style.opacity = "1", 10);

    const toastMessage = document.getElementById("toastMessage");
    toastMessage.textContent = "登録処理を行っています…";

    /* ▼ 入力値取得 */
    const lastName = document.getElementById("lastName").value.trim();
    const firstName = document.getElementById("firstName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("passwordConfirm").value;

    const msg = document.getElementById("msg");
    msg.textContent = "";

    if (password !== passwordConfirm) {
      msg.textContent = "パスワードが一致しません。";
      toastMessage.textContent = "パスワードが一致しません。";
      return;
    }

    try {
      /* ▼ Firestoreで重複チェック */
      const userCheck = await db.collection("users")
        .where("email", "==", email)
        .get();

      if (!userCheck.empty) {
        msg.textContent = "このメールアドレスは既に登録されています。";
        toastMessage.textContent = "すでに登録されています。";
        return;
      }

      /* ▼ Firebase Authentication で新規登録 */
      const newUser = await firebase.auth().createUserWithEmailAndPassword(email, password);
      const uid = newUser.user.uid;

      /* ▼ Firestoreへ保存 */
      await db.collection("users").doc(uid).set({
        lastName,
        firstName,
        email,
        phone,
        createdAt: new Date()
      });

      /* ▼ ローカルストレージへ保存 */
      const profile = {
        displayName: `${lastName} ${firstName}`,
        userId: uid,
        email,
        phone,
        pictureUrl: ""
      };
      localStorage.setItem("userProfile", JSON.stringify(profile));

      msg.textContent = "登録が完了しました。";
      toastMessage.textContent = "登録が完了しました。";

    } catch (err) {
      msg.textContent = "登録に失敗しました：" + err.message;
      toastMessage.textContent = "登録に失敗しました。";
    }
  });
</script>

</body>
</html>
