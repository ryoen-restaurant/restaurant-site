<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録情報編集｜Ryo緑</title>

  <link rel="stylesheet" href="style.css">

  <!-- Firebase v8互換 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

<header class="header">
  <div class="logo">Ryo緑</div>
</header>

<section class="section reserve-panel-vertical">
  <h2>登録情報を編集</h2>

  <div id="formBox" class="reserve-links" style="margin-bottom:20px;">
    <p>読み込み中...</p>
  </div>

  <div class="reserve-links">
    <button id="saveBtn" class="reserve-btn" style="background:#5b8;">保存する</button>
    <a href="mypage.html" class="reserve-btn" style="background:#888;">戻る</a>
  </div>
</section>

<script>
  /* ▼ Firebase設定（正しいプロジェクトに統一） */
  const firebaseConfig = {
    apiKey: "AIzaSyDnXJIOmutkJ0SrPln5XdKHUF9UUEnhtdI",
    authDomain: "ryoenn-1dc81.firebaseapp.com",
    projectId: "ryoenn-1dc81",
    storageBucket: "ryoenn-1dc81.appspot.com",   // ← 修正済み（最重要）
    messagingSenderId: "92335833506",
    appId: "1:92335833506:web:ac55b67620a086cfd332fb",
    measurementId: "G-6D3M8D7VG6"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let profile = null;
  let userData = {};  // ← 読み込み中停止防止

  async function init() {
    await liff.init({ liffId: "2011522851-uNGHHKMk" });

    /* ▼ LINEログイン */
    if (liff.isLoggedIn()) {
      const p = await liff.getProfile();
      profile = {
        displayName: p.displayName,
        userId: p.userId,
        pictureUrl: p.pictureUrl
      };
    }

    /* ▼ Googleログイン */
    const googleUser = firebase.auth().currentUser;
    if (googleUser) {
      profile = {
        displayName: googleUser.displayName,
        userId: googleUser.uid,
        pictureUrl: googleUser.photoURL,
        email: googleUser.email
      };
    }

    /* ▼ ローカル保存（新規登録ユーザー） */
    if (!profile) {
      const saved = localStorage.getItem("userProfile");
      if (saved) profile = JSON.parse(saved);
    }

    /* ▼ 未ログインなら戻す */
    if (!profile) {
      window.location.href = "reserve.html";
      return;
    }

    /* ▼ Firestoreからユーザーデータ取得 */
    try {
      const userDoc = await db.collection("users").doc(profile.userId).get();

      if (userDoc.exists) {
        userData = userDoc.data();
      } else {
        userData = {};  // ← データが無い場合も安全に初期化
      }
    } catch (e) {
      console.warn("Firestore読み込み失敗:", e);
      userData = {};  // ← 読み込み失敗時も初期化
    }

    renderForm();  // ← 必ず最後に呼ぶ
  }

  /* ▼ フォーム描画 */
  function renderForm() {
    document.getElementById("formBox").innerHTML = `
      <label>姓</label>
      <input id="lastName" type="text" value="${userData.lastName || ""}" class="reserve-input">

      <label>名</label>
      <input id="firstName" type="text" value="${userData.firstName || ""}" class="reserve-input">

      <label>電話番号</label>
      <input id="phone" type="text" value="${userData.phone || ""}" class="reserve-input">

      <label>メールアドレス</label>
      <input id="email" type="email" value="${userData.email || profile.email || ""}" class="reserve-input">

      <label>LINE名（displayName）</label>
      <input id="displayName" type="text" value="${userData.displayName || profile.displayName || ""}" class="reserve-input">

      <label>住所</label>
      <input id="address" type="text" value="${userData.address || ""}" class="reserve-input">

<label>会員番号</label>
<input id="memberId" type="text" value="${userData.memberNumber || ""}" class="reserve-input" readonly style="background:#eee; cursor:not-allowed;">
    `;
  }

  /* ▼ 保存処理 */
  document.getElementById("saveBtn").addEventListener("click", async () => {
    console.log("currentUser:", firebase.auth().currentUser);
    console.log("profile:", profile);

const data = {
  lastName: document.getElementById("lastName").value,
  firstName: document.getElementById("firstName").value,
  phone: document.getElementById("phone").value,
  email: document.getElementById("email").value,
  displayName: document.getElementById("displayName").value,
  address: document.getElementById("address").value
  // memberId は保存しない（自動付与された値を保持）
};

    await db.collection("users").doc(profile.userId).set(data, { merge: true });

    alert("保存しました");
    window.location.href = "mypage.html";
  });

  init();
</script>

</body>
</html>
