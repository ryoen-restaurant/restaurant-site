<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>イベント管理画面</title>

  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      background: #faf6e8f5;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #4a7c59;
    }

    /* ===========================
       ログイン画面（横幅修正済み）
    =========================== */
    #login {
      width: 95%;              /* ← スマホで横幅いっぱいに近くする */
      max-width: 420px;        /* ← PCでは適度な幅にする */
      margin: 40px auto;
      background: #fffdf7;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      text-align: center;

      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #login h2 {
      margin-bottom: 16px;
      color: #4a7c59;
    }

    #login input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    #login button {
      width: 100%;
      padding: 14px;
      background: #4a7c59;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    /* ===========================
       管理画面
    =========================== */
    #admin {
      max-width: 700px;
      margin: 20px auto;
      display: none;
    }

    .admin-card {
      background: #fffdf7;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    .admin-card input,
    .admin-card textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .admin-btn {
      width: 100%;
      padding: 14px;
      background: #4a7c59;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    /* ===========================
       イベント一覧
    =========================== */
    .event-item {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .event-item img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .event-item button {
      padding: 10px 14px;
      margin-right: 10px;
      border: none;
      border-radius: 8px;
      background: #4a7c59;
      color: #fff;
      cursor: pointer;
    }

    /* ===========================
       編集フォーム
    =========================== */
    #editArea {
      background: #fffdf7;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-top: 20px;
      display: none;
    }

    #editArea input,
    #editArea textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    #editArea button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #4a7c59;
      color: #fff;
      margin-right: 10px;
      cursor: pointer;
    }

    /* ===========================
       スマホ最適化
    =========================== */
    @media (max-width: 600px) {
      #login {
        width: 95%;        /* ← スマホではさらに広げる */
        padding: 28px 20px;
        min-height: 75vh;
      }
    }
  </style>
</head>

<body>

<h1>イベント管理画面</h1>

<!-- ▼ ログイン画面 -->
<div id="login">
  <h2>ログイン</h2>
  <h2>※スタッフ専用ページです※</h2>
  <input id="email" type="email" placeholder="メールアドレス">
  <input id="password" type="password" placeholder="パスワード">
  <button id="loginBtn">ログイン</button>
</div>

<!-- ▼ 管理画面 -->
<div id="admin">

  <div class="admin-card">
    <h2>新規イベント追加</h2>
    <input id="title" type="text" placeholder="タイトル">
    <textarea id="desc" placeholder="説明"></textarea>
    <input id="image" type="file">
    <button id="addBtn" class="admin-btn">イベントを追加</button>
  </div>

  <div class="admin-card">
    <h2>イベント一覧</h2>
    <div id="list"></div>
  </div>

  <div id="editArea">
    <h2>イベント編集</h2>
    <input id="editTitle" type="text" placeholder="タイトル">
    <textarea id="editDesc" placeholder="説明"></textarea>
    <input id="editImage" type="file">
    <button id="saveEditBtn">保存する</button>
    <button id="cancelEditBtn">キャンセル</button>
  </div>

</div>

<!-- ▼ Firebase処理 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDnXJIOmutkJ0SrPln5XdKHUF9UUEnhtdI",
    authDomain: "ryoenn-1dc81.firebaseapp.com",
    projectId: "ryoenn-1dc81",
    storageBucket: "ryoenn-1dc81.firebasestorage.app",
    messagingSenderId: "92335833506",
    appId: "1:92335833506:web:ac55b67620a086cfd332fb",
    measurementId: "G-6D3M8D7VG6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  const editArea  = document.getElementById("editArea");
  const editTitle = document.getElementById("editTitle");
  const editDesc  = document.getElementById("editDesc");
  const editImage = document.getElementById("editImage");

  let editId = null;

  loginBtn.onclick = () => {
    signInWithEmailAndPassword(auth, email.value, password.value)
      .then(() => {
        login.style.display = "none";
        admin.style.display = "block";
        loadEvents();
      })
      .catch(e => alert("ログイン失敗: " + e.code));
  };

  async function loadEvents() {
    list.innerHTML = "";
    const snap = await getDocs(collection(db, "events"));
    snap.forEach(docData => {
      const d = docData.data();
      list.innerHTML += `
        <div class="event-item">
          <img src="${d.imageUrl}">
          <strong>${d.title}</strong><br>
          <p>${d.description}</p>
          <button onclick="editEvent('${docData.id}', '${d.title}', '${d.description}')">編集</button>
          <button onclick="del('${docData.id}')">削除</button>
        </div>
      `;
    });
  }

  window.editEvent = (id, title, desc) => {
    editId = id;
    editTitle.value = title;
    editDesc.value = desc;
    editArea.style.display = "block";
  };

  saveEditBtn.onclick = async () => {
    const newTitle = editTitle.value;
    const newDesc  = editDesc.value;

    let newImageUrl = null;

    const file = editImage.files[0];
    if (file) {
      const storageRef = ref(storage, "events/" + file.name);
      await uploadBytes(storageRef, file);
      newImageUrl = await getDownloadURL(storageRef);
    }

    const updateData = {
      title: newTitle,
      description: newDesc
    };

    if (newImageUrl) updateData.imageUrl = newImageUrl;

    await updateDoc(doc(db, "events", editId), updateData);

    alert("編集を保存しました");
    editArea.style.display = "none";
    loadEvents();
  };

  cancelEditBtn.onclick = () => {
    editArea.style.display = "none";
  };

  window.del = async (id) => {
    await deleteDoc(doc(db, "events", id));
    loadEvents();
  };

  addBtn.onclick = async () => {
    const file = image.files[0];
    if (!file) return alert("画像を選んでください");

    const storageRef = ref(storage, "events/" + file.name);
    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);

    await addDoc(collection(db, "events"), {
      title: title.value,
      description: desc.value,
      imageUrl: url,
      createdAt: new Date()
    });

    alert("追加しました");
    loadEvents();
  };
</script>

</body>
</html>
